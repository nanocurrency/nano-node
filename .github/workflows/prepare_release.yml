name: Prepare Release
# Opens the release branch for the major develop is at and moves develop on to the next major.
# Run it on develop; ci/deploy/README.md describes where it fits in a release.
on:
  workflow_dispatch:

permissions:
  contents: write # push the release branch and the version bump
  pull-requests: write # open the version bump pull request

jobs:
  prepare:
    name: Prepare release from ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare Release
        run: ci/deploy/prepare-release.sh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
