name: Build & Deploy
# Builds and publishes the packages and images of one build tag.
# Tag Build starts it on every tag it creates; run it by hand on a tag to rebuild that tag.
# Every package and image is attested; ci/deploy/README.md shows how to verify one.
on:
  workflow_dispatch:

env:
  CI_TAG: ${{ github.ref_name }}
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: submodule.fetchJobs
  GIT_CONFIG_VALUE_0: 8

jobs:
  check_tag:
    name: Check Tag
    runs-on: ubuntu-24.04
    steps:
      - name: Require a build tag
        run: |
          if [[ "$GITHUB_REF" != refs/tags/V* ]]; then
            echo "::error::Run this workflow on a build tag, not on $GITHUB_REF_NAME"
            exit 1
          fi

  macos:
    name: macOS [${{ matrix.network }}]
    needs: check_tag
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        network: ["BETA", "LIVE"]
    env:
      NETWORK: ${{ matrix.network }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Prepare
        run: ci/prepare/macos/prepare.sh

      - name: Build Packages
        run: ci/build-packages.sh

      - name: Attest Packages
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: packages/*

      - name: Add Attestation to Packages
        run: cp "$BUNDLE" "packages/nano-node-${CI_TAG}-Darwin.sigstore.json"
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}

      - name: Upload Packages
        if: env.AWS_ACCESS_KEY_ID != ''
        run: ci/deploy/upload.sh packages/*
        env:
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          S3_BUILD_DIRECTORY: ${{ vars.S3_BUILD_DIRECTORY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2

  linux:
    name: Linux [${{ matrix.network }}]
    needs: check_tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        network: ["BETA", "LIVE"]
    env:
      NETWORK: ${{ matrix.network }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Prepare
        run: sudo -E ci/prepare/linux/prepare.sh

      - name: Build Packages
        run: ci/build-packages.sh

      - name: Attest Packages
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: packages/*

      - name: Add Attestation to Packages
        run: cp "$BUNDLE" "packages/nano-node-${CI_TAG}-Linux.sigstore.json"
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}

      - name: Upload Packages
        if: env.AWS_ACCESS_KEY_ID != ''
        run: ci/deploy/upload.sh packages/*
        env:
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          S3_BUILD_DIRECTORY: ${{ vars.S3_BUILD_DIRECTORY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2

  windows:
    name: Windows [${{ matrix.network }}]
    needs: check_tag
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        network: ["BETA", "LIVE"]
    env:
      NETWORK: ${{ matrix.network }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Prepare
        run: ci/prepare/windows/prepare.ps1

      - name: Build Packages
        run: ci/build-packages.sh
        shell: bash

      - name: Attest Packages
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: packages/*

      - name: Add Attestation to Packages
        run: cp "$BUNDLE" "packages/nano-node-${CI_TAG}-win64.sigstore.json"
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}

      - name: Upload Packages
        if: env.AWS_ACCESS_KEY_ID != ''
        run: ci/deploy/upload.sh packages/*
        shell: bash
        env:
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          S3_BUILD_DIRECTORY: ${{ vars.S3_BUILD_DIRECTORY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2

  docker:
    name: Docker [${{ matrix.network }}]
    needs: check_tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    strategy:
      matrix:
        network: ["BETA", "LIVE"]
    env:
      NETWORK: ${{ matrix.network }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - name: Build Image
        id: image
        run: ci/deploy/docker-build.sh

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image (ghcr.io)
        id: ghcr
        run: ci/deploy/docker-push.sh ${{ steps.image.outputs.image }} ghcr.io/${{ github.repository }}/${{ steps.image.outputs.name }} ${{ env.CI_TAG }} latest

      - name: Attest Image (ghcr.io)
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.ghcr.outputs.digest }}
          push-to-registry: true

      - name: Log in to Docker Hub
        if: env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER || 'nanoreleaseteam' }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # CI never moves the live latest tag on Docker Hub, only beta's
      - name: Push Image (Docker Hub)
        if: env.DOCKER_PASSWORD != ''
        id: dockerhub
        run: ci/deploy/docker-push.sh ${{ steps.image.outputs.image }} docker.io/${{ vars.DOCKER_REGISTRY || 'nanocurrency' }}/${{ steps.image.outputs.name }} ${{ env.CI_TAG }} ${{ matrix.network == 'BETA' && 'latest' || '' }}

      - name: Attest Image (Docker Hub)
        if: env.DOCKER_PASSWORD != ''
        uses: actions/attest@v4
        with:
          subject-name: docker.io/${{ vars.DOCKER_REGISTRY || 'nanocurrency' }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.dockerhub.outputs.digest }}
          push-to-registry: true
