name: Build & Deploy
on:
  schedule:
    - cron: "0 0 * * 3,6" # Every Wednesday and Saturday at 00:00
  workflow_dispatch:
    inputs:
        is_release_build:
          description: 'Is this a release build?'
          required: false
          default: 'false'

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: submodule.fetchJobs
  GIT_CONFIG_VALUE_0: 8

jobs:
  prepare_build:
    name: Prepare Build
    runs-on: ubuntu-24.04
    outputs:
      ci_tag: ${{ steps.set_vars.outputs.ci_tag }}
      tag_created: ${{ steps.set_vars.outputs.tag_created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set the tag and version
        id: tag_set
        run: |
          ci/actions/generate_next_git_tag.sh -c
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          IS_RELEASE_BUILD: ${{ github.event.inputs.is_release_build || 'false' }}

      - name: Set output
        id: set_vars
        run: |
          echo "ci_tag=$CI_TAG" >> $GITHUB_OUTPUT
          echo "tag_created=$TAG_CREATED" >> $GITHUB_OUTPUT

  osx_job:
    name: macOS [${{ matrix.network }}]
    needs: prepare_build
    if: ${{ needs.prepare_build.outputs.tag_created == 'true' }}
    runs-on: macos-26
    strategy:
      matrix:
        network: ["BETA", "LIVE"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
          ref: ${{ needs.prepare_build.outputs.ci_tag }}
          repository: ${{ github.repository }}

      - name: Prepare
        run: ci/prepare/macos/prepare.sh
        
      - name: Build Packages
        run: ci/build-packages.sh
        env:
          NETWORK: ${{ matrix.network }}
          CI_TAG: ${{ needs.prepare_build.outputs.ci_tag }}

      - name: Upload Packages
        run: ci/deploy/upload.sh packages/*
        env:
          NETWORK: ${{ matrix.network }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          S3_BUILD_DIRECTORY: ${{ vars.S3_BUILD_DIRECTORY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2

  linux_job:
    name: Linux [${{ matrix.network }}]
    needs: prepare_build
    if: ${{ needs.prepare_build.outputs.tag_created == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        network: ["BETA", "LIVE"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
          ref: ${{ needs.prepare_build.outputs.ci_tag }}
          repository: ${{ github.repository }}

      - name: Prepare
        run: sudo -E ci/prepare/linux/prepare.sh

      - name: Build Packages
        run: ci/build-packages.sh
        env:
          NETWORK: ${{ matrix.network }}
          CI_TAG: ${{ needs.prepare_build.outputs.ci_tag }}

      - name: Upload Packages
        run: ci/deploy/upload.sh packages/*
        env:
          NETWORK: ${{ matrix.network }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          S3_BUILD_DIRECTORY: ${{ vars.S3_BUILD_DIRECTORY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2

  linux_docker_job:
    name: Docker [${{ matrix.network }}]
    needs: prepare_build
    if: ${{ needs.prepare_build.outputs.tag_created == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        network: ["BETA", "LIVE"]
    env:
      CI_TAG: ${{ needs.prepare_build.outputs.ci_tag }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
          ref: ${{ needs.prepare_build.outputs.ci_tag }}
          repository: ${{ github.repository }}

      - name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - name: Build Image
        id: image
        run: ci/deploy/docker-build.sh
        env:
          NETWORK: ${{ matrix.network }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image (ghcr.io)
        run: ci/deploy/docker-push.sh ${{ steps.image.outputs.image }} ghcr.io/${{ github.repository }}/${{ steps.image.outputs.name }} ${{ env.CI_TAG }} latest

      - name: Log in to Docker Hub
        if: env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER || 'nanoreleaseteam' }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # CI never moves the live latest tag on Docker Hub, only beta's
      - name: Push Image (Docker Hub)
        if: env.DOCKER_PASSWORD != ''
        run: ci/deploy/docker-push.sh ${{ steps.image.outputs.image }} docker.io/${{ vars.DOCKER_REGISTRY || 'nanocurrency' }}/${{ steps.image.outputs.name }} ${{ env.CI_TAG }} ${{ matrix.network == 'BETA' && 'latest' || '' }}

  windows_job:
    name: Windows [${{ matrix.network }}]
    needs: prepare_build
    if: ${{ needs.prepare_build.outputs.tag_created == 'true' }}
    runs-on: windows-2022
    strategy:
      matrix:
        network: ["BETA", "LIVE"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
          ref: ${{ needs.prepare_build.outputs.ci_tag }}
          repository: ${{ github.repository }}

      - name: Prepare
        run: ci/prepare/windows/prepare.ps1

      - name: Build Packages
        run: ci/build-packages.sh
        shell: bash
        env:
          NETWORK: ${{ matrix.network }}
          CI_TAG: ${{ needs.prepare_build.outputs.ci_tag }}

      - name: Upload Packages
        run: ci/deploy/upload.sh packages/*
        shell: bash
        env:
          NETWORK: ${{ matrix.network }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          S3_BUILD_DIRECTORY: ${{ vars.S3_BUILD_DIRECTORY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
