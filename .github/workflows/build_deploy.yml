name: Build & Deploy
# Builds and publishes the packages and images of one build tag.
# Tag Build starts it on every tag it creates; run it by hand on a tag to rebuild that tag.
# Every package and image is attested; ci/deploy/README.md shows how to verify one.
on:
  workflow_dispatch:

env:
  CI_TAG: ${{ github.ref_name }}
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: submodule.fetchJobs
  GIT_CONFIG_VALUE_0: 8

jobs:
  check_tag:
    name: Check Tag
    runs-on: ubuntu-24.04
    steps:
      - name: Require a build tag
        run: |
          if [[ "$GITHUB_REF" != refs/tags/V* ]]; then
            echo "::error::Run this workflow on a build tag, not on $GITHUB_REF_NAME"
            exit 1
          fi

  macos:
    name: macOS [${{ matrix.network }}]
    needs: check_tag
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        network: ["beta", "live"]
    env:
      NETWORK: ${{ matrix.network }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: "recursive"

      - name: Prepare
        run: ci/prepare/macos/prepare.sh

      - name: Build Packages
        run: ci/build-packages.sh

      - name: Attest Packages
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packages/*

      - name: Add Attestation to Packages
        run: cp "$BUNDLE" "packages/nano-node-${CI_TAG}-Darwin.sigstore.json"
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}

      - name: Upload Packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nano-node-${{ env.CI_TAG }}-Darwin-${{ matrix.network }}
          path: packages/

      - name: Publish Packages
        if: env.AWS_ACCESS_KEY_ID != ''
        run: ci/deploy/upload.sh packages/*
        env:
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          S3_BUILD_DIRECTORY: ${{ vars.S3_BUILD_DIRECTORY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2

  linux:
    name: Linux [${{ matrix.network }}]
    needs: check_tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        network: ["beta", "live"]
    env:
      NETWORK: ${{ matrix.network }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: "recursive"

      - name: Prepare
        run: sudo -E ci/prepare/linux/prepare.sh

      - name: Build Packages
        run: ci/build-packages.sh

      - name: Attest Packages
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packages/*

      - name: Add Attestation to Packages
        run: cp "$BUNDLE" "packages/nano-node-${CI_TAG}-Linux.sigstore.json"
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}

      - name: Upload Packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nano-node-${{ env.CI_TAG }}-Linux-${{ matrix.network }}
          path: packages/

      - name: Publish Packages
        if: env.AWS_ACCESS_KEY_ID != ''
        run: ci/deploy/upload.sh packages/*
        env:
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          S3_BUILD_DIRECTORY: ${{ vars.S3_BUILD_DIRECTORY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2

  windows:
    name: Windows [${{ matrix.network }}]
    needs: check_tag
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        network: ["beta", "live"]
    env:
      NETWORK: ${{ matrix.network }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: "recursive"

      - name: Prepare
        run: ci/prepare/windows/prepare.ps1

      - name: Build Packages
        run: ci/build-packages.sh
        shell: bash

      - name: Attest Packages
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packages/*

      - name: Add Attestation to Packages
        run: cp "$BUNDLE" "packages/nano-node-${CI_TAG}-win64.sigstore.json"
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}

      - name: Upload Packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nano-node-${{ env.CI_TAG }}-win64-${{ matrix.network }}
          path: packages/

      - name: Publish Packages
        if: env.AWS_ACCESS_KEY_ID != ''
        run: ci/deploy/upload.sh packages/*
        shell: bash
        env:
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          S3_BUILD_DIRECTORY: ${{ vars.S3_BUILD_DIRECTORY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2

  docker:
    name: Docker [${{ matrix.network }}]
    needs: check_tag
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        network: ["beta", "live"]
    uses: ./.github/workflows/docker_deploy.yml
    with:
      network: ${{ matrix.network }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
