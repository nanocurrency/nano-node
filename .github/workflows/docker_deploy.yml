name: Build & Publish Docker Image
on:
  workflow_call:
    inputs:
      network:
        required: true
        type: string
    secrets:
      DOCKER_PASSWORD:
        required: false

env:
  CI_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build [${{ matrix.arch }}]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      NETWORK: ${{ inputs.network }}
      DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: submodule.fetchJobs
      GIT_CONFIG_VALUE_0: 8
    outputs:
      name: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: "recursive"

      - name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - name: Build Image
        id: image
        run: ci/deploy/docker-build.sh

      - name: Check and Save Image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          image_ref=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          docker run --rm "$image_ref" --version
          archive="$RUNNER_TEMP/docker-save.tar"
          docker save --platform "linux/$ARCH" --output "$archive" "$image_ref"
          # The config digest identifies the smoke-tested platform across Docker image stores
          config=$(tar -xOf "$archive" manifest.json | jq -er 'select(length == 1) | .[0].Config')
          image_id="sha256:$(tar -xOf "$archive" "$config" | sha256sum | cut -d ' ' -f 1)"
          echo "Smoke-tested linux/$ARCH image $image_ref (config $image_id)"
          printf '%s\n' "$image_id" > "$RUNNER_TEMP/$ARCH.id"
          # Keep the Docker config bytes when compressing layers from either image store
          skopeo copy --format v2s2 --dest-compress-format gzip "docker-archive:$archive" "oci-archive:$RUNNER_TEMP/$ARCH.tar"

      - name: Upload Image for Publication
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: docker-${{ inputs.network }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/${{ matrix.arch }}.tar
            ${{ runner.temp }}/${{ matrix.arch }}.id
          if-no-files-found: error
          compression-level: 0
          retention-days: 30 # GitHub's workflow rerun window
          overwrite: true

  publish:
    name: Publish Image Index
    needs: build
    concurrency:
      group: docker-publish-${{ needs.build.outputs.name }}
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: ${{ needs.build.outputs.name }}
      NETWORK: ${{ inputs.network }}
      HUB_REPOSITORY: docker.io/${{ vars.DOCKER_REGISTRY || 'nanocurrency' }}/${{ needs.build.outputs.name }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: docker-${{ inputs.network }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/docker-images

      - uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          release: v0.11.1

      - name: Assemble Both Platforms Locally
        run: |
          layout="ocidir://$RUNNER_TEMP/node-index"
          images="$RUNNER_TEMP/docker-images"
          for arch in amd64 arm64; do
            regctl image import "$layout:$arch" "$images/$arch.tar"
          done
          regctl index create "$layout:release" --ref "$layout:amd64" --ref "$layout:arm64"
          for arch in amd64 arm64; do
            expected_id=$(<"$images/$arch.id")
            manifest_digest=$(regctl manifest head "$layout:release" --platform "linux/$arch" --require-digest)
            manifest=$(regctl manifest get "$layout@$manifest_digest" --format raw-body)
            imported_id=$(jq -er '.config.digest' <<< "$manifest")
            if [[ "$imported_id" != "$expected_id" ]]; then
              echo "::error::linux/$arch was smoke-tested as $expected_id but imported as $imported_id" >&2
              exit 1
            fi
            if ! jq -e 'all(.layers[].mediaType; test("[.+]gzip$"))' <<< "$manifest" >/dev/null; then
              echo "::error::Expected gzip-compressed image layers for linux/$arch" >&2
              exit 1
            fi
            printf '| `linux/%s` | `%s` | `%s` |\n' "$arch" "$expected_id" "$manifest_digest"
          done > "$RUNNER_TEMP/platform-digests.md"
          echo "GHCR_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY,,}/$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKER_PASSWORD != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ vars.DOCKER_USER || 'nanoreleaseteam' }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish Multi-Platform Image
        id: publish
        run: |
          targets=("$GHCR_REPOSITORY:$CI_TAG" "$GHCR_REPOSITORY:latest")
          if [[ -n "$DOCKER_PASSWORD" ]]; then
            targets+=("$HUB_REPOSITORY:$CI_TAG")
            if [[ "$NETWORK" == beta ]]; then
              targets+=("$HUB_REPOSITORY:latest")
            fi
          fi
          ci/deploy/docker-push.sh "ocidir://$RUNNER_TEMP/node-index:release" "${targets[@]}"

      - name: Summarize Published Image
        if: ${{ !cancelled() && (steps.publish.outputs.ghcr_digest != '' || steps.publish.outputs.hub_digest != '') }}
        env:
          INDEX_DIGEST: ${{ steps.publish.outputs.ghcr_digest || steps.publish.outputs.hub_digest }}
        run: |
          {
            printf '### `%s:%s`\n\n' "$IMAGE_NAME" "$CI_TAG"
            echo '| Platform | Smoke-tested image ID (config digest) | Manifest digest |'
            echo '| --- | --- | --- |'
            cat "$RUNNER_TEMP/platform-digests.md"
            printf '\nIndex digest `%s`\n' "$INDEX_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest Image (ghcr.io)
        if: ${{ !cancelled() && steps.publish.outputs.ghcr_digest != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.ghcr_digest }}
          push-to-registry: true

      - name: Attest Image (Docker Hub)
        if: ${{ !cancelled() && steps.publish.outputs.hub_digest != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.HUB_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.hub_digest }}
          push-to-registry: true
